output_dir: "./outputs/laugh"
train_data:
  video_path: "data/laugh.mp4"
  prompt: "A white man is laughing."
  n_sample_frames: 16
validation_data:
  prompts:
  - "A white man wearing sunglasses is laughing."
  - "A white man is crying."
  - "A bald man wearing sunglasses is crying."
  video_length: 16
  frame_rate: 2
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: true
  num_inv_steps: 50
max_train_steps: 500
updated_modules:
  - "attn1"
  - "attn2.to_q"
  - "attn_temp"
  - "swa_attn1"
checkpointing_steps: 1000
validation_steps: 100