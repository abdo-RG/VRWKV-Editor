output_dir: "./outputs/seagull-flying"

train_data:
  video_path: "data/seagull-flying.mp4"
  prompt: "A grey seagull flies in a colorless blue sky."
  n_sample_frames: 16

validation_data:
  prompts:
    - "A tiny airplane flies in a colorless blue sky"
    - "A grey seagull flies in a cloudy sky"
    - "A dog flies in a colorless blue sky"
  video_length: 16
  frame_rate: 2
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: true
  num_inv_steps: 50
max_train_steps: 500
updated_modules:
  - "attn1"
  - "attn2.to_q"
  - "attn_temp"
  - "swa_attn1"
checkpointing_steps: 1000
validation_steps: 100