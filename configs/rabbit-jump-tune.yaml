output_dir: "./outputs/rabbit-jump"
train_data:
  video_path: "data/rabbit.mp4"
  prompt: "a rabbit is jumping on the grass"
  n_sample_frames: 8
  frame_rate: 1
validation_data:
  prompts:
    - "an origami rabbit is jumping on the grass"
    - "an orange cat is jumping on the grass"
    - "a rabbit is jumping on the moon"
  video_length: 8
  frame_rate: 1
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: True
  num_inv_steps: 50
max_train_steps: 500
updated_modules:
  - "attn1"
  - "attn2.to_q"
  - "attn_temp"
  - "swa_attn1"
checkpointing_steps: 1000
validation_steps: 100