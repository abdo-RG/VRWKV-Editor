output_dir: outputs/r14mech/car-turn_linear_attn
train_data:
  video_path: data/car-turn.mp4
  prompt: "a jeep car is moving on the road"
  n_sample_frames: 16
validation_data:
  prompts:
  - "a jeep car is moving on the beach"
  - "a sports car is moving on the road"
  video_length: 16
  frame_rate: 1
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: true
  num_inv_steps: 50
max_train_steps: 500
updated_modules:
- "attn1"
- "attn2.to_q"
- "attn_temp"
checkpointing_steps: 1000
validation_steps: 500
spatial_mode: quad_only
temporal_mixer: linear_attn
