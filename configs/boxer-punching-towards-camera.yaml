output_dir: "./outputs/boxer-punching-towards-camera"

train_data:
  video_path: "data/boxer-punching-towards-camera.mp4"
  prompt: "A boxer wearing black boxing gloves punches towards the camera."
  n_sample_frames: 8
  frame_rate: 1
validation_data:
  prompts:
    - "A boxer wearing black boxing gloves punches towards the camera, watercolor style."
    - "A kickboxer wearing black gloves kicks towards the camera."
    - "A boxer woman wearing black boxing gloves punches towards the camera."
  video_length: 8
  frame_rate: 1
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: true
  num_inv_steps: 50
max_train_steps: 500
updated_modules:
  - "attn1"
  - "attn2.to_q"
  - "attn_temp"
  - "swa_attn1"
checkpointing_steps: 1000
validation_steps: 100