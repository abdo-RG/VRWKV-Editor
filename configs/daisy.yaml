output_dir: "./outputs/daisy"
train_data:
  video_path: "data/daisy.mp4"
  prompt: "A close-up of daisies with vibrant yellow centers and white petals."
  n_sample_frames: 9
validation_data:
  prompts:
  - "A close-up of daisies portrayed with the swirling, vibrant strokes of an impressionist painting."
  - "A close-up of exotic, luminous flowers, bioluminescent with hues of neon blue and green."
  - "A close-up of daisies with vibrant yellow centers and white petals, at night, shimmering with magic dust."
  - "Animated daisies softly glowing, nestled on a lunar landscape under a starry night sky."
  video_length: 9
  frame_rate: 2
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: true
  num_inv_steps: 50
max_train_steps: 500
updated_modules:
  - "attn1"
  - "attn2.to_q"
  - "attn_temp"
  - "swa_attn1"
checkpointing_steps: 1000
validation_steps: 100