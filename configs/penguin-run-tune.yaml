output_dir: "./outputs/penguin-run"

train_data:
  video_path: "./data/penguin_ice.mp4"
  prompt: "a penguin is running on the ice"
  n_sample_frames: 8
  frame_rate: 1

validation_data:
  prompts:
    - "a crochet penguin is running on the ice"
    - "a penguin is running on the grass"
    - "a kangaroo is running on Mars planet"
  video_length: 8
  frame_rate: 1
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: true
  num_inv_steps: 50
max_train_steps: 500
updated_modules:
  - "attn1"
  - "attn2.to_q"
  - "attn_temp"
  - "swa_attn1"
checkpointing_steps: 1000
validation_steps: 100