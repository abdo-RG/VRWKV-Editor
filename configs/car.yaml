output_dir: "./outputs/car"
train_data:
  video_path: "./data/car.mp4"
  prompt: "a car is driving on the road"
  n_sample_frames: 8
  frame_rate: 1
validation_data:
  prompts:
  - "a car is driving on the railway"
  - "a truck is driving on the road"
  - "a train is driving on the railway"
  video_length: 8
  frame_rate: 1
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: true
  num_inv_steps: 50
max_train_steps: 500
updated_modules:
  - "attn1"
  - "attn2.to_q"
  - "attn_temp"
  - "swa_attn1"
checkpointing_steps: 1000
validation_steps: 100
