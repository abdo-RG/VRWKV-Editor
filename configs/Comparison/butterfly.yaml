output_dir: "./outputs/comparison/butterfly"
train_data:
  video_path: "data/Comparison/butterfly.mp4"
  prompt: "A butterfly with black and orange wings perches on a plant amidst a field of golden grass."
  n_sample_frames: 16
validation_data:
  prompts:
  - "A dragonfly with shimmering wings perches on a plant amidst a field of golden grass."
  frame_rate: 2
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: true
  num_inv_steps: 50
max_train_steps: 500
updated_modules:
  - "attn1"
  - "attn2.to_q"
  - "attn_temp"
  - "swa_attn1"
checkpointing_steps: 1000
validation_steps: 100