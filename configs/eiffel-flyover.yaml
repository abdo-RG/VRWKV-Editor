output_dir: "./outputs/eiffel-flyover"
train_data:
  video_path: "data/eiffel-flyover.mp4"
  prompt: "Drone flyover of the Eiffel Tower in front of the city, sunset"
  n_sample_frames: 16
validation_data:
  prompts:
  - "Drone flyover of the Eiffel Tower in front of the city, sunset"
  - "Drone flyover of the Eiffel Tower in front of a large fireworks display"
  - "Drone flyover of the space Needle in front of the city, 3D animation style"
  - "Drone flyover of the Canadian National Tower, surrounded by martian desert"
  video_length: 16
  frame_rate: 2
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: true
  num_inv_steps: 50
max_train_steps: 500
updated_modules:
  - "attn1"
  - "attn2.to_q"
  - "attn_temp"
  - "swa_attn1"
checkpointing_steps: 1000
validation_steps: 100