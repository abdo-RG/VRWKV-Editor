output_dir: "./outputs/miami-surf"

train_data:
  video_path: "data/miami-surf.mp4"
  prompt: "Several people ride surfboards in the ocean."
  n_sample_frames: 16

validation_data:
  prompts:
    - "Several people ride motorcycles in the pink ocean."
    - "Several people ride boogie boards on a concrete skate park."
    - "Several people ride surfboards in a wave pool."
  video_length: 16
  frame_rate: 2
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: true
  num_inv_steps: 50
max_train_steps: 500
updated_modules:
  - "attn1"
  - "attn2.to_q"
  - "attn_temp"
  - "swa_attn1"
checkpointing_steps: 1000
validation_steps: 100